services:
  postgres:
    image: postgres:16-alpine
    container_name: snooker_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: snooker_club
    volumes:
      - snooker_pg_data:/var/lib/postgresql/data

volumes:
  snooker_pg_data:
